<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto-helm Control Tower</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #101820; color: #edf4f7; }
    body { max-width: 1050px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { margin-bottom: 4px; } .hint { color: #aac0ca; margin-top: 0; }
    section { background: #1c2933; border: 1px solid #35505e; border-radius: 12px; padding: 20px; margin-top: 20px; }
    label { display: grid; gap: 6px; color: #c4d4dc; font-size: .9rem; }
    input, select, button { font: inherit; padding: 9px 11px; border-radius: 6px; border: 1px solid #56717e; background: #0e1b22; color: #fff; }
    button { background: #126d82; border: 0; cursor: pointer; font-weight: 600; }
    button:hover { background: #1789a2; } button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .row > label { flex: 1 1 130px; } .wide { flex: 3 1 260px !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #35505e; }
    th { color: #aac0ca; } .muted { color: #aac0ca; } .error { color: #ff9e9e; }
    #message { min-height: 1.4em; } code { color: #a6ecf5; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; }
    .metric { background: #10212b; border: 1px solid #35505e; border-radius: 9px; padding: 14px; }
    .metric strong { display: block; font-size: 1.5rem; margin: 8px 0 4px; }
    .metric small { color: #9eb5c0; }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; margin-top: 14px; }
    .chart { background: #10212b; border: 1px solid #35505e; border-radius: 9px; padding: 14px; min-width: 0; }
    .chart h3 { margin: 0 0 8px; font-size: 1rem; }
    .chart svg { display: block; width: 100%; height: 210px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; color: #b7cbd4; font-size: .78rem; }
    .legend span::before { content: '●'; color: var(--series-color); padding-right: 4px; }
  </style>
</head>
<body>
  <h1>Auto-helm Control Tower</h1>
  <p class="hint">서비스 상태 조회와 dev 학습 배치 실행. 이 화면은 컨트롤타워 API에만 접속합니다.</p>
  <section>
    <div class="row">
      <label class="wide">컨트롤 토큰 <input id="token" type="password" autocomplete="off" placeholder="AUTOHELM_CONTROL_TOKEN"></label>
      <button id="connect">연결</button>
    </div>
    <p id="message" class="muted">토큰은 현재 탭의 메모리에만 보관합니다.</p>
  </section>
  <section>
    <div class="row">
      <h2 style="margin:0;flex:1">운영 대시보드</h2>
      <label>조회 기간 <select id="range"><option value="1h">최근 1시간</option><option value="6h" selected>최근 6시간</option><option value="24h">최근 24시간</option></select></label>
    </div>
    <p id="dashboardState" class="muted">컨트롤타워 연결 후 Prometheus 지표를 표시합니다.</p>
    <div id="metrics" class="metric-grid"></div>
    <div id="charts" class="chart-grid"></div>
  </section>
  <section>
    <h2>서비스 관측</h2>
    <p class="muted">기록 기반 상태입니다. 마지막 갱신 시각이 오래되면 실행 중으로 판단하지 않습니다.</p>
    <table><thead><tr><th>서비스</th><th>상태</th><th>관측 시각</th><th>근거</th></tr></thead><tbody id="services"></tbody></table>
  </section>
  <section>
    <h2>학습 배치</h2>
    <div class="row">
      <label>작업 <select id="command"><option value="collect">과거 분봉 수집</option><option value="fit">모델 학습</option><option value="promote-dev">dev 모델 승격</option></select></label>
      <label>종목코드 <input id="symbol" value="005930" maxlength="6"></label>
      <label>시장 <select id="venue"><option>KRX</option><option>NXT</option></select></label>
      <label>장 구간 <input id="session" value="regular"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label>시작일 <input id="from" type="date"></label>
      <label>종료일 <input id="to" type="date"></label>
      <label>시작 시각 <input id="startTime" type="time" value="09:00"></label>
      <label>종료 시각 <input id="endTime" type="time" value="15:30"></label>
      <label>승격할 버전 <input id="version" placeholder="linret1-..."></label>
      <button id="run">실행</button>
    </div>
    <p class="muted">한 번에 한 작업만 실행합니다. prd 승격과 주문은 이 화면에서 제공하지 않습니다.</p>
    <table><thead><tr><th>작업</th><th>종목</th><th>상태</th><th>시작</th><th>종료 코드</th></tr></thead><tbody id="jobs"></tbody></table>
  </section>
  <script>
    let token = '';
    let dashboardRequest = 0;
    const $ = id => document.getElementById(id);
    const message = (value, error = false) => { $('message').textContent = value; $('message').className = error ? 'error' : 'muted'; };
    const cell = (row, value) => { const td = document.createElement('td'); td.textContent = value ?? '—'; row.appendChild(td); };
    const fill = (id, rows, values) => {
      const body = $(id); body.replaceChildren();
      for (const item of rows) { const tr = document.createElement('tr'); values(item).forEach(value => cell(tr, value)); body.appendChild(tr); }
    };
    const svgNode = (tag, attributes = {}) => {
      const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
      return node;
    };
    const colors = ['#4bd2eb', '#f9bb67', '#82d89a', '#d4a4f8', '#ff8794', '#a7bcff', '#e4d575'];
    const number = value => Number(value).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
    const statValue = stat => {
      if (stat.value == null) return '데이터 없음';
      if (stat.unit === 'boolean') return stat.value === 1 ? '실행 중' : '중단';
      if (stat.unit === 'seconds') return stat.value >= 3600 ? `${number(stat.value / 3600)}시간` :
        stat.value >= 60 ? `${number(stat.value / 60)}분` : `${number(stat.value)}초`;
      return number(stat.value);
    };
    function renderStats(stats) {
      const grid = $('metrics'); grid.replaceChildren();
      for (const stat of stats) {
        const card = document.createElement('div'); card.className = 'metric';
        const label = document.createElement('div'); label.textContent = stat.title;
        const value = document.createElement('strong'); value.textContent = statValue(stat);
        const at = document.createElement('small'); at.textContent = stat.sampledAt ? `관측 ${new Date(stat.sampledAt).toLocaleTimeString('ko-KR')}` : '관측값 없음';
        card.append(label, value, at); grid.appendChild(card);
      }
    }
    function renderChart(chart) {
      const card = document.createElement('div'); card.className = 'chart';
      const title = document.createElement('h3'); title.textContent = chart.title; card.appendChild(title);
      const series = chart.series.filter(item => item.points.length);
      if (!series.length) { const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = '선택한 기간에 데이터가 없습니다.'; card.appendChild(empty); return card; }
      const all = series.flatMap(item => item.points);
      const first = Math.min(...all.map(point => Date.parse(point.at)));
      const last = Math.max(...all.map(point => Date.parse(point.at)));
      const min = Math.min(0, ...all.map(point => point.value));
      const max = Math.max(1, ...all.map(point => point.value));
      const svg = svgNode('svg', { viewBox: '0 0 600 210', role: 'img', 'aria-label': chart.title });
      const x = time => 54 + (Date.parse(time) - first) / Math.max(1, last - first) * 532;
      const y = value => 170 - (value - min) / Math.max(0.000001, max - min) * 145;
      for (let i = 0; i <= 3; i++) {
        const level = min + (max - min) * i / 3;
        svg.appendChild(svgNode('line', { x1: 54, x2: 586, y1: y(level), y2: y(level), stroke: '#34505c', 'stroke-width': 1 }));
        const label = svgNode('text', { x: 47, y: y(level) + 4, fill: '#9eb5c0', 'text-anchor': 'end', 'font-size': 11 });
        label.textContent = number(level); svg.appendChild(label);
      }
      for (const [index, item] of series.entries()) {
        const points = item.points.map(point => `${x(point.at).toFixed(1)},${y(point.value).toFixed(1)}`).join(' ');
        svg.appendChild(svgNode('polyline', { points, fill: 'none', stroke: colors[index % colors.length], 'stroke-width': 2.2, 'stroke-linejoin': 'round' }));
      }
      for (const [time, position, anchor] of [[first, 54, 'start'], [last, 586, 'end']]) {
        const label = svgNode('text', { x: position, y: 198, fill: '#9eb5c0', 'text-anchor': anchor, 'font-size': 11 });
        label.textContent = new Date(time).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); svg.appendChild(label);
      }
      card.appendChild(svg);
      const legend = document.createElement('div'); legend.className = 'legend';
      series.forEach((item, index) => { const marker = document.createElement('span'); marker.style.setProperty('--series-color', colors[index % colors.length]); marker.textContent = item.label; legend.appendChild(marker); });
      card.appendChild(legend); return card;
    }
    async function refreshDashboard() {
      if (!token) return;
      const requestId = ++dashboardRequest;
      try {
        const data = await api(`/api/dashboard?range=${$('range').value}`);
        if (requestId !== dashboardRequest) return;
        if (!data.available) { $('dashboardState').textContent = 'Prometheus에 연결할 수 없습니다. 모니터링 서비스를 확인하세요.'; $('metrics').replaceChildren(); $('charts').replaceChildren(); return; }
        $('dashboardState').textContent = `${data.environment} · ${new Date(data.at).toLocaleString('ko-KR')} 기준 · 15초마다 갱신`;
        renderStats(data.stats);
        const grid = $('charts'); grid.replaceChildren(...data.charts.map(renderChart));
      } catch (e) { if (requestId === dashboardRequest) $('dashboardState').textContent = e.message; }
    }
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, cache: 'no-store', headers: { 'X-Control-Token': token, 'Content-Type': 'application/json' } });
      if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.error || `HTTP ${response.status}`); }
      return response.json();
    }
    async function refresh() {
      if (!token) return;
      try {
        const data = await api('/api/snapshot');
        message(`${data.environment} · ${new Date(data.at).toLocaleString('ko-KR')}`);
        fill('services', data.services, s => [s.service, s.state, s.observedAt ? new Date(s.observedAt).toLocaleString('ko-KR') : '—', s.detail]);
        fill('jobs', data.jobs, j => [j.command, j.symbol || '—', j.state, new Date(j.startedAt).toLocaleString('ko-KR'), j.exitCode]);
      } catch (e) { message(e.message, true); }
    }
    $('connect').onclick = () => { token = $('token').value; $('token').value = ''; refresh(); refreshDashboard(); };
    $('range').onchange = refreshDashboard;
    $('run').onclick = async () => {
      if (!token) return message('먼저 컨트롤 토큰으로 연결하세요.', true);
      const request = Object.fromEntries(['command', 'symbol', 'venue', 'session', 'from', 'to', 'startTime', 'endTime', 'version'].map(id => [id, $(id).value]));
      if (!request.from) delete request.from;
      if (!request.to) delete request.to;
      try { const job = await api('/api/training/jobs', { method: 'POST', body: JSON.stringify(request) }); message(`${job.command} 작업 ${job.id} 시작`); refresh(); }
      catch (e) { message(e.message, true); }
    };
    setInterval(refresh, 10000);
    setInterval(refreshDashboard, 15000);
  </script>
</body>
</html>
